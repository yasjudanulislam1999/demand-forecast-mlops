[project]
name = "demand-forecast-mlops"
version = "0.1.0"
description = "Production ML System: Demand Forecasting + Full MLOps Platform (AWS)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "mlflow>=2.10",
  "pandera>=0.20",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
